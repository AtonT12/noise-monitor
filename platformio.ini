[env:seeed_xiao_esp32s3]
; Pin the PlatformIO platform for reproducible Arduino-ESP32 Core 3.x builds.
; Platform 8.0.0 bundles Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5).
platform = espressif32@8.0.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -Iinclude
